<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>同步歌詞</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="bg"><img id="bg-img" alt=""><img id="bg-img2" alt=""></div>
  <main id="app" class="idle">
    <section id="info">
      <img id="cover" alt="">
      <div id="meta">
        <div id="title"></div>
        <div id="artist"></div>
      </div>
      <div id="progress">
        <div id="bar"><div id="bar-fill"></div></div>
        <div id="times"><span id="t-cur">0:00</span><span id="t-left">-0:00</span></div>
      </div>
      <div id="controls">
        <button id="c-play" class="act" title="暫停 / 繼續">⏸</button>
        <button id="c-skip" class="act" title="跳過這首">⏭</button>
        <label id="vol" title="音量"><span id="vol-ic">🔊</span><input id="vol-in" class="act" type="range" min="0" max="100" step="1" value="50"><span id="vol-val">50</span></label>
      </div>
    </section>
    <section id="lyrics-wrap">
      <div id="lyrics"></div>
      <div id="status"></div>
    </section>
  </main>
  <div id="offset">
    <button id="off-minus" title="歌詞慢一點">−</button>
    <span id="off-val">0.0s</span>
    <button id="off-plus" title="歌詞快一點">+</button>
  </div>
  <button id="q-fab" title="播放佇列 / 點歌">☰ 佇列<span id="q-count"></span></button>
  <button id="fun-fab" title="活動面板：轉蛋、釣魚、小遊戲…"><span id="fun-fab-ic">🎮</span> 活動<span id="fun-fab-n"></span></button>
  <aside id="qpanel" hidden>
    <header><b>播放佇列</b><span id="q-who"></span><button id="q-close" title="關閉">✕</button></header>
    <form id="q-form" autocomplete="off">
      <input id="q-input" maxlength="300" placeholder="歌名或 YouTube 網址">
      <div class="q-btns"><button type="submit" id="q-add" class="act" title="排到最後(播放清單會整串加)">加入</button><button type="button" id="q-next" class="act" title="下一首播">插入</button></div>
    </form>
    <div id="q-now"></div>
    <div id="q-list"></div>
  </aside>
  <div id="reacts" aria-hidden="true"></div>
  <div id="react-bar"></div>
  <div id="toast"></div>
  <div id="lol" hidden></div>
  <div id="mini" hidden><img id="mini-cover" alt=""><div id="mini-text"><div id="mini-title"></div><div id="mini-line"></div></div></div>
  <script type="module" src="main.js"></script>
</body>
</html>
